name: Publish GitHub Pages

# Deploy a revision of main only when all jobs in "tests" pass.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage static application (no backend)
        run: |
          set -eu
          mkdir -p _site/model
          cp index.html styles.css app.js charts.js sensitivity.js guided-setup.js _site/
          cp model/*.js _site/model/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/model/scenario-engine.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
